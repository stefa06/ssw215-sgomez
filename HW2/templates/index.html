<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Stefania Gomez | Portfolio</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <script src="{{ url_for('static', filename='app.js') }}" defer></script>
  </head>
  <body>
    <nav class="site-nav" aria-label="Main navigation">
      <a class="site-nav__brand" href="#top">Stefania Gomez</a>
      <div class="site-nav__links">
        <a href="#projects">Projects</a>
        <a href="https://github.com/stefaniagomez" target="_blank" rel="noopener">GitHub</a>
      </div>
    </nav>

    <header id="top" class="hero">
      <div class="hero__content">
        <h1>Stefania Gomez</h1>
        <p class="subtitle">I dance professionaly</p>
        <p class="bio">I'm from Spain and Colombia. I love pasta</p>
        <a class="button" href="#projects">See my projects</a>
        <button class="button button--disabled" type="button" disabled>
          Contact me (coming soon)
        </button>
      </div>
      <img
        class="avatar"
        src="{{ url_for('static', filename='assets/avatar.jpg') }}"
        width="240"
        height="240"
        alt="Stefania Gomez"
      >
    </header>

    <main>
      <section id="projects" class="projects" aria-labelledby="projects-title">
        <h2 id="projects-title">Projects</h2>
        <p class="saved-count" aria-live="polite">No projects saved.</p>
        <div class="project-filter">
          <label for="filter-input">Find a project:</label>
          <input id="filter-input" type="search">
          <button class="clear-search" type="button" disabled>Clear search</button>
        </div>
        <form class="project-create">
          <label for="new-title">Project title</label>
          <input id="new-title" name="title" type="text" maxlength="120" required>
          <label for="new-description">Description</label>
          <textarea id="new-description" name="description" maxlength="255" required></textarea>
          <label for="new-technologies">Technologies</label>
          <input id="new-technologies" name="technologies" type="text" maxlength="255" required>
          <label for="new-github-url">GitHub URL</label>
          <input
            id="new-github-url"
            name="github_url"
            type="url"
            maxlength="255"
            placeholder="https://github.com/username/project"
            required
          >
          <button class="button" type="submit">Add project</button>
        </form>
        <p class="project-status" aria-live="polite"></p>
        <p class="filter-message" id="project-count" aria-live="polite">
          Loading projects...
        </p>
        <div class="project-cards"></div>
      </section>
    </main>

    <footer class="site-footer">
      <a href="https://github.com/stefaniagomez" target="_blank" rel="noopener">GitHub</a>
    </footer>
  </body>
</html>
